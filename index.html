<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ETF监控">
<meta name="theme-color" content="#0a0e27">
<title>ETF股息率监控</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>📊 ETF 股息率监控</h1>
  <div class="subtitle">TTM股息率百分位 · 低估加仓 · 高估减仓</div>
  <div class="refresh-row">
    <span class="update-time" id="updateTime">点击刷新加载数据</span>
    <button class="btn-refresh" id="btnRefresh" onclick="loadAll()">
      <span class="icon">↻</span> 刷新
    </button>
  </div>
</div>

<!-- 自定义ETF输入区 -->
<div class="add-section">
  <div class="add-title">添加自定义ETF</div>
  <div class="add-row">
    <input type="text" id="addInput" placeholder="输入6位ETF代码，如 159941" maxlength="6"
      inputmode="numeric" pattern="[0-9]*">
    <button class="btn-add" onclick="addEtf()">+ 添加</button>
  </div>
</div>

<!-- 标签栏 -->
<div class="tab-bar">
  <button class="tab active" data-tab="default" onclick="switchTab('default')">
    默认标的 <span class="tab-count" id="defaultCount">0</span>
  </button>
  <button class="tab" data-tab="custom" onclick="switchTab('custom')">
    自定义标的 <span class="tab-count" id="customCount">0</span>
  </button>
</div>

<!-- 筛选 + 排序 -->
<div class="filter-sort-bar">
  <div class="filter-chips" id="filterChips"></div>
  <div class="sort-group">
    <button class="btn-sort active" data-sort="percentile" onclick="setSort('percentile')">百分位</button>
    <button class="btn-sort" data-sort="yield" onclick="setSort('yield')">股息率</button>
    <button class="btn-sort" data-sort="name" onclick="setSort('name')">名称</button>
  </div>
</div>

<div id="etfList" class="etf-list">
  <div class="empty" id="placeholder">
    <div style="font-size:48px;margin-bottom:12px">📈</div>
    <div>点击「刷新」加载ETF数据</div>
    <div style="font-size:11px;margin-top:6px;color:var(--text-muted)">首次加载约需15秒</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="error-toast" id="errorToast"></div>

<script>
// ====== 默认ETF池：追踪指数 ======
const DEFAULT_POOL = [
  // 大盘指数
  { code: '510050', name: '上证50', market: 1 },
  { code: '510300', name: '沪深300', market: 1 },
  { code: '510180', name: '上证180', market: 1 },
  { code: '510500', name: '中证500', market: 1 },
  // 高分红红利
  { code: '510880', name: '上证红利', market: 1 },
  { code: '515080', name: '中证红利', market: 1 },
  { code: '515180', name: '中证红利(易方达)', market: 1 },
  { code: '515100', name: '红利低波100', market: 1 },
  { code: '159905', name: '深证红利', market: 0 },
  { code: '515890', name: '红利质量', market: 1 },
  { code: '513530', name: '港股通红利', market: 1 },
  { code: '515300', name: '300红利低波', market: 1 },
];

const WINDOW_DAYS = 750;
let currentTab = 'default';
let currentSort = 'percentile';
let activeFilters = new Set(); // empty = show all

// ====== 信号定义 ======
const SIGNAL_DEFS = [
  { level: 'strong_buy', label: '强烈加仓', color: '#ff6b6b' },
  { level: 'buy', label: '加仓', color: '#ffa94d' },
  { level: 'moderate_buy', label: '适度加仓', color: '#ffd43b' },
  { level: 'hold', label: '持有', color: '#868e96' },
  { level: 'moderate_sell', label: '适度减仓', color: '#4dabf7' },
  { level: 'sell', label: '减仓', color: '#da77f2' },
  { level: 'strong_sell', label: '强烈减仓', color: '#ff6b6b' },
  { level: 'no_data', label: '无分红', color: '#bdc3c7' },
];

// ====== 本地存储 ======
function getCustomPool() { try { return JSON.parse(localStorage.getItem('etf_custom_pool') || '[]'); } catch(e) { return []; } }
function saveCustomPool(pool) { localStorage.setItem('etf_custom_pool', JSON.stringify(pool)); }
function getMarket(code) { return code.startsWith('5') || code.startsWith('6') ? 1 : 0; }

// ====== 数据加载（fetch + eval） ======
async function fetchEtData(code) {
  const url = `https://fund.eastmoney.com/pingzhongdata/${code}.js?t=${Date.now()}`;
  const resp = await fetch(url, { cache: 'no-store' });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const text = await resp.text();

  // 提取关键变量
  let navData = null, fundName = null;

  // 提取 Data_netWorthTrend
  const navMatch = text.match(/var\s+Data_netWorthTrend\s*=\s*(\[[\s\S]*?\]);/);
  if (navMatch) navData = JSON.parse(navMatch[1]);

  // 提取 fS_name
  const nameMatch = text.match(/var\s+fS_name\s*=\s*"([^"]*)"/);
  if (nameMatch) fundName = nameMatch[1];

  return { navData, fundName };
}

// ====== 解析 ======
function parsePingzhong(navData) {
  if (!navData || !navData.length) return null;
  const prices = [], dividends = [];
  for (const item of navData) {
    const date = new Date(item.x);
    prices.push({ date, nav: item.y });
    if (item.unitMoney && typeof item.unitMoney === 'string') {
      const m = item.unitMoney.match(/([\d.]+)\s*元/);
      if (m) dividends.push({ date, amount: parseFloat(m[1]) });
    }
  }
  return { prices, dividends };
}

// ====== 计算 ======
function calcTTMYield(prices, dividends) {
  return prices.map(p => {
    const oneYearAgo = new Date(p.date.getTime() - 365 * 24 * 3600 * 1000);
    const ttmDiv = dividends.filter(d => d.date > oneYearAgo && d.date <= p.date).reduce((s, d) => s + d.amount, 0);
    return { date: p.date, nav: p.nav, ttmDividend: ttmDiv, ttmYield: p.nav > 0 ? ttmDiv / p.nav : 0 };
  });
}

function calcPercentile(values, window = WINDOW_DAYS) {
  return values.map((v, i) => {
    const start = Math.max(0, i - window + 1);
    const w = values.slice(start, i + 1);
    return w.length < 2 ? 50 : (w.filter(x => x < v).length / w.length) * 100;
  });
}

function getSignal(pct, hasDividends) {
  if (!hasDividends) return { level: 'no_data', text: '无分红数据', color: '#bdc3c7' };
  if (pct == null) return { level: 'no_data', text: '无分红数据', color: '#bdc3c7' };
  if (pct <= 10) return { level: 'strong_buy', text: '强烈加仓', color: '#ff6b6b' };
  if (pct <= 25) return { level: 'buy', text: '加仓', color: '#ffa94d' };
  if (pct <= 40) return { level: 'moderate_buy', text: '适度加仓', color: '#ffd43b' };
  if (pct <= 60) return { level: 'hold', text: '持有', color: '#868e96' };
  if (pct <= 75) return { level: 'moderate_sell', text: '适度减仓', color: '#4dabf7' };
  if (pct <= 90) return { level: 'sell', text: '减仓', color: '#da77f2' };
  return { level: 'strong_sell', text: '强烈减仓', color: '#ff6b6b' };
}

// ====== 加载单只ETF ======
async function loadOne(etf) {
  try {
    const { navData, fundName } = await fetchEtData(etf.code);
    const parsed = parsePingzhong(navData);
    if (!parsed || !parsed.prices.length) return null;

    const name = fundName || etf.name;
    const enriched = calcTTMYield(parsed.prices, parsed.dividends);
    const yields = enriched.map(e => e.ttmYield);
    const hasDividends = parsed.dividends.length > 0;
    const percentiles = hasDividends ? calcPercentile(yields) : [];
    const latest = enriched[enriched.length - 1];
    const latestPct = hasDividends ? percentiles[percentiles.length - 1] : null;
    const signal = getSignal(latestPct, hasDividends);

    const oneYearAgo = new Date(Date.now() - 365 * 24 * 3600 * 1000);
    const chartData = hasDividends ? enriched.filter(e => e.date >= oneYearAgo).map(e => ({
      date: e.date, yield: e.ttmYield * 100, percentile: percentiles[enriched.indexOf(e)],
    })) : [];

    return {
      code: etf.code, name, price: latest.nav, ttmYield: latest.ttmYield * 100,
      percentile: latestPct, signal, chartData, dividendCount: parsed.dividends.length, hasDividends,
    };
  } catch (e) {
    console.warn(`加载 ${etf.code} 失败:`, e.message);
    return null;
  }
}

// ====== 主加载 ======
let defaultData = [], customData = [];

async function loadAll() {
  const btn = document.getElementById('btnRefresh');
  const list = document.getElementById('etfList');
  const customPool = getCustomPool();
  const total = DEFAULT_POOL.length + customPool.length;

  btn.classList.add('spinning');
  btn.disabled = true;
  list.innerHTML = `<div class="loading"><div class="spinner"></div><div class="text">正在加载 ${total} 只ETF数据...</div></div>`;

  defaultData = [];
  for (const etf of DEFAULT_POOL) {
    const r = await loadOne(etf);
    if (r) defaultData.push(r);
  }

  customData = [];
  for (const etf of customPool) {
    const r = await loadOne(etf);
    if (r) customData.push(r);
  }

  document.getElementById('updateTime').textContent = `更新: ${new Date().toLocaleString('zh-CN')}`;
  document.getElementById('defaultCount').textContent = defaultData.length;
  document.getElementById('customCount').textContent = customData.length;

  renderFilterChips();
  renderTab();
  btn.classList.remove('spinning');
  btn.disabled = false;
}

// ====== 筛选 ======
function renderFilterChips() {
  const data = currentTab === 'default' ? defaultData : customData;
  const counts = {};
  data.forEach(d => { counts[d.signal.level] = (counts[d.signal.level] || 0) + 1; });

  const chips = SIGNAL_DEFS.filter(s => counts[s.level] > 0);
  const el = document.getElementById('filterChips');
  el.innerHTML = `<button class="filter-chip ${activeFilters.size === 0 ? 'active' : ''}"
    onclick="clearFilters()" style="border-color:var(--accent);color:var(--accent)">全部</button>` +
    chips.map(s =>
    `<button class="filter-chip ${activeFilters.has(s.level) ? 'active' : ''}"
      onclick="toggleFilter('${s.level}')"
      style="--chip-color:${s.color}">${s.label}<span class="chip-num">${counts[s.level]}</span></button>`
  ).join('');
}

function toggleFilter(level) {
  if (activeFilters.has(level)) activeFilters.delete(level);
  else activeFilters.add(level);
  renderFilterChips();
  renderTab();
}

function clearFilters() {
  activeFilters.clear();
  renderFilterChips();
  renderTab();
}

// ====== 排序 ======
function setSort(sort) {
  currentSort = sort;
  document.querySelectorAll('.btn-sort').forEach(b => b.classList.toggle('active', b.dataset.sort === sort));
  renderTab();
}

function sortData(data) {
  const sorted = [...data];
  if (currentSort === 'percentile') {
    sorted.sort((a, b) => {
      if (a.hasDividends && !b.hasDividends) return -1;
      if (!a.hasDividends && b.hasDividends) return 1;
      return (a.percentile ?? 50) - (b.percentile ?? 50);
    });
  } else if (currentSort === 'yield') {
    sorted.sort((a, b) => {
      if (a.hasDividends && !b.hasDividends) return -1;
      if (!a.hasDividends && b.hasDividends) return 1;
      return (b.ttmYield || 0) - (a.ttmYield || 0);
    });
  } else if (currentSort === 'name') {
    sorted.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
  }
  return sorted;
}

// ====== 标签切换 ======
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  activeFilters.clear();
  renderFilterChips();
  renderTab();
}

function renderTab() {
  const raw = currentTab === 'default' ? defaultData : customData;
  let data = activeFilters.size > 0 ? raw.filter(d => activeFilters.has(d.signal.level)) : raw;
  data = sortData(data);
  renderSummary(raw);
  renderList(data);
}

// ====== 添加/删除 ======
function addEtf() {
  const input = document.getElementById('addInput');
  const code = input.value.trim();
  if (!code || !/^\d{6}$/.test(code)) { showError('请输入6位数字ETF代码'); return; }
  const pool = getCustomPool();
  if (DEFAULT_POOL.find(e => e.code === code)) { showError('该ETF已在默认列表中'); return; }
  if (pool.find(e => e.code === code)) { showError('该ETF已在自定义列表中'); return; }
  pool.push({ code, name: `ETF${code}`, market: getMarket(code) });
  saveCustomPool(pool);
  input.value = '';
  switchTab('custom');
  loadAll();
}

function removeEtf(code) {
  saveCustomPool(getCustomPool().filter(e => e.code !== code));
  loadAll();
}

// ====== 渲染 ======
function renderSummary(data) {
  const bar = document.getElementById('summaryBar');
  // Use the original tab data (unfiltered) for summary counts
  const raw = currentTab === 'default' ? defaultData : customData;
  const counts = {};
  raw.forEach(d => { counts[d.signal.level] = (counts[d.signal.level] || 0) + 1; });

  const chips = SIGNAL_DEFS.filter(s => counts[s.level] > 0).map(s =>
    `<div class="summary-chip" style="border-color:${s.color}20">
      <span style="color:${s.color}">${s.label}</span>
      <span class="count" style="color:${s.color}">${counts[s.level]}</span>
    </div>`
  );
  bar.innerHTML = chips.join('');
}

function renderList(data) {
  const list = document.getElementById('etfList');
  if (!data.length) {
    list.innerHTML = activeFilters.size > 0
      ? '<div class="empty">当前筛选条件下无匹配标的</div>'
      : currentTab === 'custom'
        ? '<div class="empty">暂无自定义标的<br><span style="font-size:12px;margin-top:8px;display:block">在上方输入ETF代码添加</span></div>'
        : '<div class="empty">暂无数据</div>';
    return;
  }

  list.innerHTML = data.map(d => {
    const s = d.signal;
    const pct = d.percentile ?? 50;
    const yieldStr = d.hasDividends && d.ttmYield > 0 ? `${d.ttmYield.toFixed(2)}%` : '--';
    const pctStr = d.hasDividends && d.percentile != null ? `${pct.toFixed(1)}%` : '--';
    const removeBtn = currentTab === 'custom'
      ? `<button class="btn-remove" onclick="event.stopPropagation();removeEtf('${d.code}')" title="删除">×</button>` : '';

    return `
    <div class="etf-card" onclick="openDetail('${d.code}')">
      <style>.etf-card[onclick*="'${d.code}'"]::before{background:${s.color}}</style>
      <div class="card-top">
        <div>
          <div class="card-name">${d.name}</div>
          <div class="card-code">${d.code}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="card-signal" style="background:${s.color}18;color:${s.color}">${s.text}</div>
          ${removeBtn}
        </div>
      </div>
      <div class="card-metrics">
        <div class="metric">
          <div class="metric-label">净值</div>
          <div class="metric-value">${d.price.toFixed(4)}</div>
        </div>
        <div class="metric">
          <div class="metric-label">TTM股息率</div>
          <div class="metric-value" style="color:${d.hasDividends ? 'var(--accent)' : 'var(--text-muted)'}">${yieldStr}</div>
        </div>
        <div class="metric">
          <div class="metric-label">百分位</div>
          <div class="metric-value" style="color:${s.color}">${pctStr}</div>
        </div>
      </div>
      ${d.hasDividends ? `
      <div class="pct-bar-wrap">
        <div class="pct-bar-bg"><div class="pct-bar-fill" style="width:${pct}%;background:${s.color}"></div></div>
        <div class="pct-bar-label"><span>0% 低估</span><span>50%</span><span>100% 高估</span></div>
      </div>` : '<div style="font-size:11px;color:var(--text-muted);margin-top:8px;text-align:center">该ETF无现金分红记录</div>'}
    </div>`;
  }).join('');
}

// ====== 详情弹窗 ======
function openDetail(code) {
  const d = [...defaultData, ...customData].find(e => e.code === code);
  if (!d) return;
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';

  const s = d.signal;
  let chartHTML = '';
  if (d.hasDividends && d.chartData && d.chartData.length > 10) {
    chartHTML = `
      <div class="chart-container"><div class="chart-title">📈 股息率走势（近1年）</div><canvas id="yieldChart"></canvas></div>
      <div class="chart-container"><div class="chart-title">📊 百分位走势（近1年）</div><canvas id="pctChart"></canvas></div>`;
  }

  const desc = {
    strong_buy: '当前股息率处于历史极低位（前10%），分红回报率很高，可考虑大幅加仓',
    buy: '当前股息率处于历史低位（前25%），性价比不错，可考虑加仓',
    moderate_buy: '当前股息率低于中位数（前40%），有一定吸引力，可适度加仓',
    hold: '当前股息率处于历史中位区间（40-60%），维持现有仓位即可',
    moderate_sell: '当前股息率偏高（后40%），估值偏贵，可适度减仓',
    sell: '当前股息率处于历史高位（后25%），估值偏高，可考虑减仓',
    strong_sell: '当前股息率处于历史极高位（后10%），估值很贵，建议大幅减仓',
    no_data: '该ETF暂无现金分红记录，无法计算股息率百分位',
  };

  content.innerHTML = `
    <div class="modal-header"><h2>${d.name}</h2><div class="code">${d.code}</div></div>
    <div class="detail-grid">
      <div class="detail-item"><div class="label">现价</div><div class="value">${d.price.toFixed(4)}</div></div>
      <div class="detail-item"><div class="label">TTM股息率</div><div class="value" style="color:${d.hasDividends ? 'var(--accent)' : 'var(--text-muted)'}">${d.hasDividends && d.ttmYield > 0 ? d.ttmYield.toFixed(2)+'%' : '--'}</div></div>
      <div class="detail-item"><div class="label">百分位</div><div class="value" style="color:${s.color}">${d.hasDividends && d.percentile != null ? d.percentile.toFixed(1)+'%' : '--'}</div></div>
      <div class="detail-item"><div class="label">历史分红次数</div><div class="value">${d.dividendCount}</div></div>
    </div>
    <div class="signal-detail" style="border-left:3px solid ${s.color}">
      <div class="signal-text" style="color:${s.color}">${s.text}</div>
      <div class="signal-desc">${desc[s.level] || ''}</div>
    </div>
    ${chartHTML}`;

  if (d.hasDividends && d.chartData && d.chartData.length > 10) {
    setTimeout(() => {
      drawChart('yieldChart', d.chartData.map(c => c.date), d.chartData.map(c => c.yield), 'rgba(100,255,218,0.8)', 'rgba(100,255,218,0.1)');
      drawChart('pctChart', d.chartData.map(c => c.date), d.chartData.map(c => c.percentile), 'rgba(218,119,242,0.8)', 'rgba(218,119,242,0.1)');
    }, 100);
  }
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

// ====== Canvas图表 ======
function drawChart(id, dates, data, strokeColor, fillColor) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth - 32, H = 200;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  if (!data.length) return;
  const min = Math.min(...data) * 0.9, max = Math.max(...data) * 1.1, range = max - min || 1;
  const padTop = 24, padBot = 30, padLeft = 40, padRight = 10;
  const chartW = W - padLeft - padRight, chartH = H - padTop - padBot;

  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padTop + (chartH / 4) * i;
    ctx.beginPath(); ctx.moveTo(padLeft, y); ctx.lineTo(W - padRight, y); ctx.stroke();
    ctx.fillStyle = '#5a6380'; ctx.font = '10px -apple-system,sans-serif'; ctx.textAlign = 'right';
    ctx.fillText((max - (range / 4) * i).toFixed(1), padLeft - 6, y + 3);
  }
  const step = Math.max(1, Math.floor(data.length / 5));
  ctx.fillStyle = '#5a6380'; ctx.font = '10px -apple-system,sans-serif'; ctx.textAlign = 'center';
  for (let i = 0; i < data.length; i += step) {
    ctx.fillText(`${dates[i].getMonth()+1}/${dates[i].getDate()}`, padLeft + (i / (data.length - 1)) * chartW, H - 8);
  }
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = padLeft + (i / (data.length - 1)) * chartW, y = padTop + ((max - v) / range) * chartH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = strokeColor; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.lineTo(padLeft + chartW, padTop + chartH); ctx.lineTo(padLeft, padTop + chartH);
  ctx.closePath(); ctx.fillStyle = fillColor; ctx.fill();
  const lastX = padLeft + chartW, lastY = padTop + ((max - data[data.length - 1]) / range) * chartH;
  ctx.beginPath(); ctx.arc(lastX, lastY, 4, 0, Math.PI * 2); ctx.fillStyle = strokeColor; ctx.fill();
  ctx.beginPath(); ctx.arc(lastX, lastY, 2, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.fillStyle = strokeColor; ctx.font = 'bold 11px -apple-system,sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(data[data.length - 1].toFixed(2), lastX - 8, lastY - 8);
}

function showError(msg) {
  const t = document.getElementById('errorToast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

document.getElementById('addInput').addEventListener('keypress', e => { if (e.key === 'Enter') addEtf(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
