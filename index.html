<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ETF监控">
<meta name="theme-color" content="#0a0e27">
<title>红利低波100监控</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<style>
.index-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.index-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.index-name{font-size:20px;font-weight:700}
.index-code{font-size:12px;color:var(--text-muted);margin-top:2px}
.signal-badge{font-size:14px;font-weight:800;padding:6px 14px;border-radius:20px;white-space:nowrap}
.metrics-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.metric{text-align:center}
.metric-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.metric-value{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.sub-list{border-top:1px solid rgba(255,255,255,0.06);padding-top:12px}
.sub-title{font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:8px}
.sub-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:rgba(255,255,255,0.02);border-radius:10px;margin-bottom:4px}
.sub-name{font-size:13px;font-weight:600}
.sub-code{font-size:11px;color:var(--text-muted)}
.sub-nav{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.sub-extra{font-size:10px;color:var(--text-muted)}
.pct-bar-wrap{margin-top:12px}
.pct-bar-bg{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden}
.pct-bar-fill{height:100%;border-radius:2px;transition:width .6s ease}
.pct-bar-label{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:4px}
</style>
</head>
<body>
<div class="header">
  <h1>📊 红利低波100 监控</h1>
  <div class="subtitle">930955 · 相对300回撤策略</div>
  <div class="refresh-row">
    <span class="update-time" id="updateTime">点击刷新加载数据</span>
    <button class="btn-refresh" id="btnRefresh" onclick="loadAll()"><span class="icon">↻</span> 刷新</button>
  </div>
</div>
<div id="mainContent" style="padding:16px">
  <div class="empty"><div style="font-size:48px;margin-bottom:12px">📈</div><div>点击「刷新」加载数据</div></div>
</div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()"><div class="modal-handle"></div><button class="modal-close" onclick="closeModal()">&times;</button><div id="modalContent"></div></div>
</div>
<div class="error-toast" id="errorToast"></div>

<script>
const BENCH='510300';
const ETFS=['159307','515100'];
const W=750;

function loadNav(code){
  return new Promise(resolve=>{
    const s=document.createElement('script');let d=false;
    const tm=setTimeout(()=>{if(!d){d=true;s.remove();resolve(null)}},15000);
    s.onload=()=>{if(d)return;clearTimeout(tm);d=true;s.remove();
      try{
        const nav=window.Data_netWorthTrend,nm=window.fS_name;
        if(!nav||!nav.length){resolve(null);return}
        const rows=[];
        for(const i of nav){
          let div=0;
          if(i.unitMoney&&typeof i.unitMoney==='string'){
            const m=i.unitMoney.match(/([\d.]+)\s*元/);if(m)div=parseFloat(m[1])}
          rows.push({date:i.x,nav:i.y,div});
        }
        resolve({name:nm,rows});
      }catch(e){resolve(null)}};
    s.onerror=()=>{if(!d){clearTimeout(tm);d=true;s.remove();resolve(null)}};
    s.src='https://fund.eastmoney.com/pingzhongdata/'+code+'.js';
    document.head.appendChild(s);
  });
}

function calcSignal(rows, benchRows){
  if(!rows||!rows.length||!benchRows||!benchRows.length)return null;
  const bMap={};benchRows.forEach(r=>bMap[r.date]=r.nav);
  const aligned=rows.filter(r=>bMap[r.date]);
  if(aligned.length<50)return null;
  const nav0=aligned[0].nav,b0=bMap[aligned[0].date];
  let relAth=0;
  const enriched=aligned.map(r=>{
    const bn=bMap[r.date];
    const navN=r.nav/nav0,bnN=bn/b0;
    const rel=navN/bnN;
    if(rel>relAth)relAth=rel;
    return{...r,relDD:relAth>0?(rel-relAth)/relAth*100:0};
  });
  const en=enriched.map((p,i)=>{
    const ct=p.date-365*864e5;
    const td=enriched.filter(d=>d.date>ct&&d.date<=p.date).reduce((s,d)=>s+d.div,0);
    return{...p,y:p.nav>0?td/p.nav*100:0};
  });
  const yldArr=en.map(e=>e.y);
  const pct=en.map((v,i)=>{
    const st=Math.max(0,i-W+1),w=yldArr.slice(st,i+1);
    return w.length<2?50:(w.filter(x=>x<v).length/w.length)*100;
  });
  const hd=en.some(e=>e.div>0);
  const lt=en[en.length-1];
  const curPct=pct[pct.length-1];
  const curRelDD=lt.relDD;
  let sg;
  if(curRelDD<-10)sg={l:'strong_buy',t:'强烈加仓',c:'#ff6b6b'};
  else if(curRelDD<-5)sg={l:'buy',t:'加仓',c:'#ffa94d'};
  else if(curRelDD<-3)sg={l:'moderate_buy',t:'适度加仓',c:'#ffd43b'};
  else if(curRelDD>-1)sg={l:'moderate_sell',t:'适度减仓',c:'#4dabf7'};
  else sg={l:'hold',t:'持有',c:'#868e96'};
  const ct=Date.now()-365*864e5;
  const ch=en.filter(e=>e.date>=ct).map(e=>({date:e.date,relDD:e.relDD,y:e.y,pct:pct[en.indexOf(e)]}));
  return{price:lt.nav,yld:lt.y,pct:curPct,hd,sg,ch,dc:en.filter(e=>e.div>0).length,relDD:curRelDD};
}

async function loadAll(){
  const b=document.getElementById('btnRefresh'),ls=document.getElementById('mainContent');
  b.classList.add('spinning');b.disabled=true;
  ls.innerHTML='<div class="loading"><div class="spinner"></div><div class="text">正在加载数据...</div></div>';
  
  const [benchData,...etfResults]=await Promise.all([loadNav(BENCH),...ETFS.map(c=>loadNav(c))]);
  const benchRows=benchData?benchData.rows:[];
  
  const subs=[];
  for(let i=0;i<ETFS.length;i++){
    const r=etfResults[i];
    if(r&&r.rows){
      subs.push({code:ETFS[i],name:r.name,nav:r.rows[r.rows.length-1].nav,divs:r.rows.filter(x=>x.div>0).length,rows:r.rows});
    }
  }
  
  if(!subs.length){
    ls.innerHTML='<div class="empty">数据加载失败</div>';
    b.classList.remove('spinning');b.disabled=false;
    return;
  }
  
  subs.sort((a,b)=>b.rows.length-a.rows.length);
  const signal=calcSignal(subs[0].rows,benchRows);
  
  document.getElementById('updateTime').textContent='更新: '+new Date().toLocaleString('zh-CN');
  
  if(!signal){
    ls.innerHTML='<div class="empty">数据不足，无法计算信号</div>';
    b.classList.remove('spinning');b.disabled=false;
    return;
  }
  
  const sg=signal.sg;
  const rdd=signal.relDD!=null?signal.relDD.toFixed(1)+'%':'--';
  const rddColor=signal.relDD<-10?'#ff6b6b':signal.relDD<-5?'#ffa94d':signal.relDD<-3?'#ffd43b':'#868e96';
  const yS=signal.hd&&signal.yld>0?signal.yld.toFixed(2)+'%':'--';
  const pS=signal.hd&&signal.pct!=null?signal.pct.toFixed(1)+'%':'--';
  
  const subsHtml=subs.map(s=>'<div class="sub-item" onclick="openD()"><div><div class="sub-name">'+s.name+'</div><div class="sub-code">'+s.code+'</div></div><div style="text-align:right"><div class="sub-nav">'+s.nav.toFixed(4)+'</div><div class="sub-extra">'+s.divs+'次分红</div></div></div>').join('');
  
  ls.innerHTML=`
    <div class="index-card" style="border-left:3px solid ${sg.c}">
      <div class="index-header">
        <div>
          <div class="index-name">红利低波100</div>
          <div class="index-code">930955.CSI</div>
        </div>
        <div class="signal-badge" style="background:${sg.c}18;color:${sg.c}">${sg.t}</div>
      </div>
      <div class="metrics-row">
        <div class="metric">
          <div class="metric-label">净值</div>
          <div class="metric-value">${signal.price.toFixed(4)}</div>
        </div>
        <div class="metric">
          <div class="metric-label">相对300回撤</div>
          <div class="metric-value" style="color:${rddColor}">${rdd}</div>
        </div>
        <div class="metric">
          <div class="metric-label">TTM股息率</div>
          <div class="metric-value" style="color:${signal.hd?'var(--accent)':'var(--text-muted)'}">${yS}</div>
        </div>
      </div>
      <div class="pct-bar-wrap">
        <div class="pct-bar-bg"><div class="pct-bar-fill" style="width:${Math.min(Math.max(signal.pct??50,0),100)}%;background:${sg.c}"></div></div>
        <div class="pct-bar-label"><span>0% 低估</span><span>50%</span><span>100% 高估</span></div>
      </div>
      <div class="sub-list">
        <div class="sub-title">追踪该指数的ETF</div>
        ${subsHtml}
      </div>
    </div>
    <div style="margin-top:16px;padding:12px;background:var(--bg-card);border-radius:12px;border:1px solid var(--border)">
      <div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px">📐 策略说明</div>
      <div style="font-size:11px;color:var(--text-muted);line-height:1.6">
        当930955相对沪深300回撤超过5%时买入，回撤收窄至1%以内时卖出。<br>
        回测超额收益 <span style="color:var(--accent)">+32.6%</span>（2020-2026），6次交易5胜1负。<br>
        当前信号: <span style="color:${sg.c};font-weight:700">${sg.t}</span>（相对回撤 ${rdd}）
      </div>
    </div>
  `;
  
  b.classList.remove('spinning');b.disabled=false;
}

function openD(){document.getElementById('modalOverlay').classList.add('active');document.body.style.overflow='hidden'}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('modalOverlay').classList.remove('active');document.body.style.overflow=''}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=8').catch(()=>{});
</script>
</body>
</html>
