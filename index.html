<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ETF监控">
<meta name="theme-color" content="#0a0e27">
<title>ETF股息率监控</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>📊 ETF 股息率监控</h1>
  <div class="subtitle">TTM股息率百分位 · 低估加仓 · 高估减仓</div>
  <div class="refresh-row">
    <span class="update-time" id="updateTime">点击刷新加载数据</span>
    <button class="btn-refresh" id="btnRefresh" onclick="loadAll()">
      <span class="icon">↻</span> 刷新
    </button>
  </div>
</div>

<!-- 添加ETF -->
<div class="add-bar" id="addBar">
  <input type="text" id="addInput" placeholder="输入ETF代码，如 510300" maxlength="6"
    inputmode="numeric" pattern="[0-9]*">
  <button class="btn-add" onclick="addEtf()">+ 添加</button>
</div>

<div class="summary-bar" id="summaryBar"></div>

<div id="etfList" class="etf-list">
  <div class="empty" id="placeholder">
    <div style="font-size:48px;margin-bottom:12px">📈</div>
    <div>点击「刷新」加载ETF数据</div>
    <div style="font-size:11px;margin-top:6px;color:var(--text-muted)">首次加载约需15秒</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="error-toast" id="errorToast"></div>

<script>
// ====== 默认ETF池（有分红数据的） ======
const DEFAULT_POOL = [
  { code: '510300', name: '沪深300ETF', market: 1 },
  { code: '510500', name: '中证500ETF', market: 1 },
  { code: '510050', name: '上证50ETF', market: 1 },
  { code: '510880', name: '红利ETF', market: 1 },
  { code: '515180', name: '红利ETF基金', market: 1 },
  { code: '515080', name: '中证红利ETF', market: 1 },
  { code: '510230', name: '金融ETF', market: 1 },
  { code: '159915', name: '创业板ETF', market: 0 },
  { code: '512890', name: '红利低波ETF', market: 1 },
  { code: '512800', name: '银行ETF', market: 1 },
  { code: '512200', name: '房地产ETF', market: 1 },
  { code: '512010', name: '医药ETF', market: 1 },
];

const WINDOW_DAYS = 750;

// ====== 本地存储管理 ======
function getPool() {
  try {
    const saved = localStorage.getItem('etf_pool');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return DEFAULT_POOL.map(e => ({...e}));
}

function savePool(pool) {
  localStorage.setItem('etf_pool', JSON.stringify(pool));
}

// ====== 自定义ETF名称映射 ======
const NAME_MAP = {};
DEFAULT_POOL.forEach(e => NAME_MAP[e.code] = e.name);

function getMarket(code) {
  return code.startsWith('5') || code.startsWith('6') ? 1 : 0;
}

// ====== JSONP加载器 ======
let _jsonCbIdx = 0;
function loadJsonp(url) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('超时')); }, 15000);
    function cleanup() { clearTimeout(timer); if (script.parentNode) script.parentNode.removeChild(script); }
    script.src = url;
    script.onload = () => { cleanup(); resolve(); };
    script.onerror = () => { cleanup(); reject(new Error('加载失败')); };
    document.head.appendChild(script);
  });
}

// ====== 解析pingzhongdata ======
function parsePingzhong(code) {
  const data = window.Data_netWorthTrend;
  if (!data || !data.length) return null;

  const prices = [];
  const dividends = [];

  for (const item of data) {
    const date = new Date(item.x);
    prices.push({ date, nav: item.y });

    if (item.unitMoney && typeof item.unitMoney === 'string') {
      const m = item.unitMoney.match(/([\d.]+)\s*元/);
      if (m) {
        dividends.push({ date, amount: parseFloat(m[1]) });
      }
    }
  }

  return { prices, dividends };
}

// ====== 获取基金名称 ======
function parseFundName(code) {
  try {
    const raw = window.Data_netWorthTrend;
    // 尝试从全局变量获取名称
    if (window.fS_name) return window.fS_name;
  } catch(e) {}
  return NAME_MAP[code] || `ETF${code}`;
}

// ====== 计算TTM股息率 ======
function calcTTMYield(prices, dividends) {
  if (!prices.length) return prices;
  return prices.map((p) => {
    const oneYearAgo = new Date(p.date.getTime() - 365 * 24 * 3600 * 1000);
    const ttmDiv = dividends
      .filter(d => d.date > oneYearAgo && d.date <= p.date)
      .reduce((sum, d) => sum + d.amount, 0);
    return {
      date: p.date, nav: p.nav,
      ttmDividend: ttmDiv,
      ttmYield: p.nav > 0 ? ttmDiv / p.nav : 0,
    };
  });
}

// ====== 计算滚动百分位 ======
function calcPercentile(values, window = WINDOW_DAYS) {
  return values.map((v, i) => {
    const start = Math.max(0, i - window + 1);
    const w = values.slice(start, i + 1);
    if (w.length < 2) return 50;
    return (w.filter(x => x < v).length / w.length) * 100;
  });
}

// ====== 信号判断 ======
function getSignal(pct, hasDividends) {
  if (!hasDividends) return { level: 'no_data', text: '无分红数据', color: '#bdc3c7' };
  if (pct == null) return { level: 'no_data', text: '无分红数据', color: '#bdc3c7' };
  if (pct <= 10) return { level: 'strong_buy', text: '强烈加仓', color: '#ff6b6b' };
  if (pct <= 25) return { level: 'buy', text: '加仓', color: '#ffa94d' };
  if (pct <= 40) return { level: 'moderate_buy', text: '适度加仓', color: '#ffd43b' };
  if (pct <= 60) return { level: 'hold', text: '持有', color: '#868e96' };
  if (pct <= 75) return { level: 'moderate_sell', text: '适度减仓', color: '#4dabf7' };
  if (pct <= 90) return { level: 'sell', text: '减仓', color: '#da77f2' };
  return { level: 'strong_sell', text: '强烈减仓', color: '#ff6b6b' };
}

// ====== 加载单只ETF ======
async function loadOne(etf) {
  try {
    window.Data_netWorthTrend = null;
    window.fS_name = null;
    await loadJsonp(`https://fund.eastmoney.com/pingzhongdata/${etf.code}.js`);

    const parsed = parsePingzhong(etf.code);
    if (!parsed || !parsed.prices.length) return null;

    const name = parseFundName(etf.code);
    const enriched = calcTTMYield(parsed.prices, parsed.dividends);
    const yields = enriched.map(e => e.ttmYield);
    const hasDividends = parsed.dividends.length > 0;
    const percentiles = hasDividends ? calcPercentile(yields) : [];
    const latest = enriched[enriched.length - 1];
    const latestPct = hasDividends ? percentiles[percentiles.length - 1] : null;
    const signal = getSignal(latestPct, hasDividends);

    // 图表数据（最近1年）
    const oneYearAgo = new Date(Date.now() - 365 * 24 * 3600 * 1000);
    const chartData = hasDividends ? enriched
      .filter(e => e.date >= oneYearAgo)
      .map((e) => ({
        date: e.date,
        yield: e.ttmYield * 100,
        percentile: percentiles[enriched.indexOf(e)],
      })) : [];

    return {
      code: etf.code,
      name,
      price: latest.nav,
      ttmYield: latest.ttmYield * 100,
      percentile: latestPct,
      signal,
      chartData,
      dividendCount: parsed.dividends.length,
      hasDividends,
    };
  } catch (e) {
    console.warn(`加载 ${etf.code} 失败:`, e.message);
    return null;
  }
}

// ====== 主加载 ======
let allData = [];

async function loadAll() {
  const btn = document.getElementById('btnRefresh');
  const list = document.getElementById('etfList');
  const pool = getPool();

  btn.classList.add('spinning');
  btn.disabled = true;
  list.innerHTML = `<div class="loading"><div class="spinner"></div><div class="text">正在加载 ${pool.length} 只ETF数据...</div></div>`;

  allData = [];
  for (const etf of pool) {
    const result = await loadOne(etf);
    if (result) allData.push(result);
  }

  // 排序：有分红数据的按百分位升序，无分红的排最后
  allData.sort((a, b) => {
    if (a.hasDividends && !b.hasDividends) return -1;
    if (!a.hasDividends && b.hasDividends) return 1;
    return (a.percentile ?? 50) - (b.percentile ?? 50);
  });

  document.getElementById('updateTime').textContent = `更新: ${new Date().toLocaleString('zh-CN')}`;
  renderSummary(allData);
  renderList(allData);

  btn.classList.remove('spinning');
  btn.disabled = false;
}

// ====== 添加ETF ======
function addEtf() {
  const input = document.getElementById('addInput');
  const code = input.value.trim();
  if (!code || !/^\d{6}$/.test(code)) {
    showError('请输入6位数字ETF代码');
    return;
  }

  const pool = getPool();
  if (pool.find(e => e.code === code)) {
    showError('该ETF已在列表中');
    return;
  }

  pool.push({ code, name: `ETF${code}`, market: getMarket(code) });
  savePool(pool);
  input.value = '';
  loadAll();
}

// ====== 删除ETF ======
function removeEtf(code) {
  let pool = getPool();
  pool = pool.filter(e => e.code !== code);
  savePool(pool);
  loadAll();
}

// ====== 恢复默认 ======
function resetPool() {
  savePool(DEFAULT_POOL.map(e => ({...e})));
  loadAll();
}

// ====== 渲染 ======
function renderSummary(data) {
  const bar = document.getElementById('summaryBar');
  const counts = {};
  data.forEach(d => { const l = d.signal.level; counts[l] = (counts[l] || 0) + 1; });

  const chips = [
    { label: '强烈加仓', count: counts.strong_buy || 0, color: '#ff6b6b' },
    { label: '加仓', count: counts.buy || 0, color: '#ffa94d' },
    { label: '适度加仓', count: counts.moderate_buy || 0, color: '#ffd43b' },
    { label: '持有', count: counts.hold || 0, color: '#868e96' },
    { label: '适度减仓', count: counts.moderate_sell || 0, color: '#4dabf7' },
    { label: '减仓', count: counts.sell || 0, color: '#da77f2' },
    { label: '强烈减仓', count: counts.strong_sell || 0, color: '#ff6b6b' },
    { label: '无分红', count: counts.no_data || 0, color: '#bdc3c7' },
  ];

  bar.innerHTML = chips.filter(c => c.count > 0).map(c =>
    `<div class="summary-chip" style="border-color:${c.color}20">
      <span style="color:${c.color}">${c.label}</span>
      <span class="count" style="color:${c.color}">${c.count}</span>
    </div>`
  ).join('');
}

function renderList(data) {
  const list = document.getElementById('etfList');
  if (!data.length) {
    list.innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }

  list.innerHTML = data.map(d => {
    const s = d.signal;
    const pct = d.percentile ?? 50;
    const yieldStr = d.hasDividends && d.ttmYield > 0 ? `${d.ttmYield.toFixed(2)}%` : '--';
    const pctStr = d.hasDividends && d.percentile != null ? `${pct.toFixed(1)}%` : '--';

    return `
    <div class="etf-card" onclick="openDetail('${d.code}')">
      <style>.etf-card[onclick*="'${d.code}'"]::before{background:${s.color}}</style>
      <div class="card-top">
        <div>
          <div class="card-name">${d.name}</div>
          <div class="card-code">${d.code}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="card-signal" style="background:${s.color}18;color:${s.color}">
            ${s.text}
          </div>
          <button class="btn-remove" onclick="event.stopPropagation();removeEtf('${d.code}')" title="删除">×</button>
        </div>
      </div>
      <div class="card-metrics">
        <div class="metric">
          <div class="metric-label">净值</div>
          <div class="metric-value">${d.price.toFixed(4)}</div>
        </div>
        <div class="metric">
          <div class="metric-label">TTM股息率</div>
          <div class="metric-value" style="color:${d.hasDividends ? 'var(--accent)' : 'var(--text-muted)'}">${yieldStr}</div>
        </div>
        <div class="metric">
          <div class="metric-label">百分位</div>
          <div class="metric-value" style="color:${s.color}">${pctStr}</div>
        </div>
      </div>
      ${d.hasDividends ? `
      <div class="pct-bar-wrap">
        <div class="pct-bar-bg">
          <div class="pct-bar-fill" style="width:${pct}%;background:${s.color}"></div>
        </div>
        <div class="pct-bar-label">
          <span>0% 低估</span><span>50%</span><span>100% 高估</span>
        </div>
      </div>` : '<div style="font-size:11px;color:var(--text-muted);margin-top:8px;text-align:center">该ETF无现金分红记录，无法计算股息率</div>'}
    </div>`;
  }).join('');
}

// ====== 详情弹窗 ======
function openDetail(code) {
  const d = allData.find(e => e.code === code);
  if (!d) return;

  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';

  const s = d.signal;
  let chartHTML = '';
  if (d.hasDividends && d.chartData && d.chartData.length > 10) {
    chartHTML = `
      <div class="chart-container">
        <div class="chart-title">📈 股息率走势（近1年）</div>
        <canvas id="yieldChart"></canvas>
      </div>
      <div class="chart-container">
        <div class="chart-title">📊 百分位走势（近1年）</div>
        <canvas id="pctChart"></canvas>
      </div>`;
  }

  const desc = {
    strong_buy: '当前股息率处于历史极低位（前10%），分红回报率很高，可考虑大幅加仓',
    buy: '当前股息率处于历史低位（前25%），性价比不错，可考虑加仓',
    moderate_buy: '当前股息率低于中位数（前40%），有一定吸引力，可适度加仓',
    hold: '当前股息率处于历史中位区间（40-60%），维持现有仓位即可',
    moderate_sell: '当前股息率偏高（后40%），估值偏贵，可适度减仓',
    sell: '当前股息率处于历史高位（后25%），估值偏高，可考虑减仓',
    strong_sell: '当前股息率处于历史极高位（后10%），估值很贵，建议大幅减仓',
    no_data: '该ETF暂无现金分红记录，无法计算股息率百分位',
  };

  content.innerHTML = `
    <div class="modal-header"><h2>${d.name}</h2><div class="code">${d.code}</div></div>
    <div class="detail-grid">
      <div class="detail-item">
        <div class="label">现价</div>
        <div class="value">${d.price.toFixed(4)}</div>
      </div>
      <div class="detail-item">
        <div class="label">TTM股息率</div>
        <div class="value" style="color:${d.hasDividends ? 'var(--accent)' : 'var(--text-muted)'}">${d.hasDividends && d.ttmYield > 0 ? d.ttmYield.toFixed(2)+'%' : '--'}</div>
      </div>
      <div class="detail-item">
        <div class="label">百分位</div>
        <div class="value" style="color:${s.color}">${d.hasDividends && d.percentile != null ? d.percentile.toFixed(1)+'%' : '--'}</div>
      </div>
      <div class="detail-item">
        <div class="label">历史分红次数</div>
        <div class="value">${d.dividendCount}</div>
      </div>
    </div>
    <div class="signal-detail" style="border-left:3px solid ${s.color}">
      <div class="signal-text" style="color:${s.color}">${s.text}</div>
      <div class="signal-desc">${desc[s.level] || ''}</div>
    </div>
    ${chartHTML}`;

  if (d.hasDividends && d.chartData && d.chartData.length > 10) {
    setTimeout(() => {
      drawChart('yieldChart', d.chartData.map(c => c.date), d.chartData.map(c => c.yield), 'rgba(100,255,218,0.8)', 'rgba(100,255,218,0.1)');
      drawChart('pctChart', d.chartData.map(c => c.date), d.chartData.map(c => c.percentile), 'rgba(218,119,242,0.8)', 'rgba(218,119,242,0.1)');
    }, 100);
  }
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

// ====== Canvas图表 ======
function drawChart(id, dates, data, strokeColor, fillColor) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth - 32;
  const H = 200;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);

  if (!data.length) return;
  const min = Math.min(...data) * 0.9;
  const max = Math.max(...data) * 1.1;
  const range = max - min || 1;
  const padTop = 24, padBot = 30, padLeft = 40, padRight = 10;
  const chartW = W - padLeft - padRight;
  const chartH = H - padTop - padBot;

  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padTop + (chartH / 4) * i;
    ctx.beginPath(); ctx.moveTo(padLeft, y); ctx.lineTo(W - padRight, y); ctx.stroke();
    ctx.fillStyle = '#5a6380'; ctx.font = '10px -apple-system,sans-serif'; ctx.textAlign = 'right';
    ctx.fillText((max - (range / 4) * i).toFixed(1), padLeft - 6, y + 3);
  }

  const step = Math.max(1, Math.floor(data.length / 5));
  ctx.fillStyle = '#5a6380'; ctx.font = '10px -apple-system,sans-serif'; ctx.textAlign = 'center';
  for (let i = 0; i < data.length; i += step) {
    const x = padLeft + (i / (data.length - 1)) * chartW;
    const d = dates[i];
    ctx.fillText(`${d.getMonth()+1}/${d.getDate()}`, x, H - 8);
  }

  ctx.beginPath();
  data.forEach((v, i) => {
    const x = padLeft + (i / (data.length - 1)) * chartW;
    const y = padTop + ((max - v) / range) * chartH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = strokeColor; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();

  ctx.lineTo(padLeft + chartW, padTop + chartH);
  ctx.lineTo(padLeft, padTop + chartH);
  ctx.closePath(); ctx.fillStyle = fillColor; ctx.fill();

  const lastX = padLeft + chartW;
  const lastY = padTop + ((max - data[data.length - 1]) / range) * chartH;
  ctx.beginPath(); ctx.arc(lastX, lastY, 4, 0, Math.PI * 2); ctx.fillStyle = strokeColor; ctx.fill();
  ctx.beginPath(); ctx.arc(lastX, lastY, 2, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.fillStyle = strokeColor; ctx.font = 'bold 11px -apple-system,sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(data[data.length - 1].toFixed(2), lastX - 8, lastY - 8);
}

// ====== 错误提示 ======
function showError(msg) {
  const toast = document.getElementById('errorToast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ====== 回车添加 ======
document.getElementById('addInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') addEtf();
});

// ====== Service Worker ======
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
