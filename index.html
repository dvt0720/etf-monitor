<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ETF监控">
<meta name="theme-color" content="#0a0e27">
<title>红利低波100监控</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<style>
.hero{background:linear-gradient(135deg,rgba(255,107,107,0.08),rgba(100,255,218,0.08));border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;margin-bottom:16px}
.hero-name{font-size:22px;font-weight:800;margin-bottom:2px}
.hero-code{font-size:12px;color:var(--text-muted);margin-bottom:16px}
.hero-signal{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.hero-badge{font-size:16px;font-weight:800;padding:8px 18px;border-radius:24px;white-space:nowrap}
.hero-desc{font-size:12px;color:var(--text-secondary);line-height:1.5}
.hero-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.hero-metric{text-align:center;padding:10px 0}
.hero-metric-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.hero-metric-value{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.bar-wrap{margin-top:8px}
.bar-bg{height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:3px;transition:width .6s ease}
.bar-marker{position:absolute;top:-3px;width:2px;height:12px;background:#fff;border-radius:1px;transition:left .6s ease}
.bar-label{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:4px}
.section{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.section-title{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:10px}
.etf-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.etf-row:last-child{border-bottom:none}
.etf-name{font-size:13px;font-weight:600}
.etf-code{font-size:11px;color:var(--text-muted)}
.etf-nav{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.etf-extra{font-size:10px;color:var(--text-muted)}
.strategy-box{font-size:11px;color:var(--text-muted);line-height:1.8}
.strategy-box strong{color:var(--text-primary)}
.highlight{color:var(--accent);font-weight:700}
.warn{color:#ffa94d}
.danger{color:#ff6b6b}
.status-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-on{background:#ff6b6b}
.status-off{background:#868e96}
.status-warn{background:#ffa94d}
</style>
</head>
<body>
<div class="header">
  <h1>📊 红利低波100 监控</h1>
  <div class="subtitle">930955 · 偏离+RSI加仓策略</div>
  <div class="refresh-row">
    <span class="update-time" id="updateTime">点击刷新加载数据</span>
    <button class="btn-refresh" id="btnRefresh" onclick="loadAll()"><span class="icon">↻</span> 刷新</button>
  </div>
</div>
<div style="padding:16px" id="main">
  <div class="empty"><div style="font-size:48px;margin-bottom:12px">📈</div><div>点击「刷新」加载数据</div></div>
</div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()"><div class="modal-handle"></div><button class="modal-close" onclick="closeModal()">&times;</button><div id="modalContent"></div></div>
</div>
<div class="error-toast" id="errorToast"></div>

<script>
const BENCH='510300';
const ETFS=['159307','515100'];

function loadNav(code){
  return new Promise(resolve=>{
    const s=document.createElement('script');let d=false;
    const tm=setTimeout(()=>{if(!d){d=true;s.remove();resolve(null)}},15000);
    s.onload=()=>{if(d)return;clearTimeout(tm);d=true;s.remove();
      try{
        const nav=window.Data_netWorthTrend,nm=window.fS_name;
        if(!nav||!nav.length){resolve(null);return}
        const rows=[];
        for(const i of nav){
          let div=0;
          if(i.unitMoney&&typeof i.unitMoney==='string'){
            const m=i.unitMoney.match(/([\d.]+)\s*元/);if(m)div=parseFloat(m[1])}
          rows.push({date:i.x,nav:i.y,div});
        }
        resolve({name:nm,rows});
      }catch(e){resolve(null)}};
    s.onerror=()=>{if(!d){clearTimeout(tm);d=true;s.remove();resolve(null)}};
    s.src='https://fund.eastmoney.com/pingzhongdata/'+code+'.js';
    document.head.appendChild(s);
  });
}

function analyze(rows){
  if(!rows||!rows.length)return null;
  const navs=rows.map(r=>r.nav);
  const n=navs.length;
  const latest=navs[n-1];
  
  // MA
  const ma5=navs.slice(-5).reduce((a,b)=>a+b,0)/Math.min(5,n);
  const ma10=navs.slice(-10).reduce((a,b)=>a+b,0)/Math.min(10,n);
  const ma20=navs.slice(-20).reduce((a,b)=>a+b,0)/Math.min(20,n);
  const bias5=(latest-ma5)/ma5*100;
  const bias10=(latest-ma10)/ma10*100;
  const bias20=(latest-ma20)/ma20*100;
  
  // RSI
  const deltas=[];for(let i=1;i<n;i++)deltas.push(navs[i]-navs[i-1]);
  const rsi=(period)=>{
    const g=deltas.slice(-period).filter(d=>d>0);
    const l=deltas.slice(-period).filter(d=>d<0).map(d=>-d);
    const ag=g.length?g.reduce((a,b)=>a+b,0)/period:0;
    const al=l.length?l.reduce((a,b)=>a+b,0)/period:0.0001;
    return 100-100/(1+ag/al);
  };
  const rsi14=rsi(14);
  const rsi6=rsi(6);
  
  // 5日涨幅
  const ret5=n>5?(navs[n-1]/navs[n-5]-1)*100:0;
  
  // TTM股息率
  const now=rows[n-1].date;
  const ct=now-365*864e5;
  const ttmDiv=rows.filter(r=>r.date>ct).reduce((s,r)=>s+r.div,0);
  const yieldTTM=ttmDiv/latest*100;
  
  // 股息率百分位
  const yields=rows.map((r,i)=>{
    const ct2=r.date-365*864e5;
    return rows.filter(d=>d.date>ct2&&d.date<=r.date).reduce((s,d)=>s+d.div,0)/r.nav*100;
  });
  const yArr=yields.slice(-750);
  const yieldPct=yArr.length>10?(yArr.filter(y=>y<yieldTTM).length/yArr.length*100):50;
  
  // 信号判断
  const buyTriggered=bias20<-3&&rsi14<35;
  const buyNear=bias20<-2&&rsi14<40;
  
  // 卖出信号
  let sellSignal='';
  if(buyTriggered){
    // 刚触发买入，显示持有倒计时
    sellSignal='持有 (25天后或RSI>65可卖)';
  }
  
  // 综合信号
  let signal,signalColor,signalDesc;
  if(buyTriggered){
    signal='🟢 建议加仓';signalColor='#ff6b6b';
    signalDesc=`三重确认触发！偏离${bias20.toFixed(1)}%、RSI${rsi14.toFixed(0)}、5日跌${ret5.toFixed(1)}%。历史100%盈利。`;
  }else if(buyNear){
    signal='🟡 关注加仓';signalColor='#ffa94d';
    signalDesc=`接近触发：偏离${bias20.toFixed(1)}%、RSI${rsi14.toFixed(0)}。等待进一步确认。`;
  }else if(bias20>2&&rsi14>65){
    signal='⚪ 持有观望';signalColor='#868e96';
    signalDesc=`价格偏高，不适合加仓。继续持有现有仓位。`;
  }else{
    signal='⚪ 持有';signalColor='#868e96';
    signalDesc=`偏离${bias20.toFixed(1)}%、RSI${rsi14.toFixed(0)}，处于正常区间。`;
  }
  
  return{latest,ma5,ma10,ma20,bias5,bias10,bias20,rsi14,rsi6,ret5,yieldTTM,yieldPct,
    signal,signalColor,signalDesc,buyTriggered,buyNear,sellSignal,
    divs:rows.filter(r=>r.div>0).length};
}

async function loadAll(){
  const b=document.getElementById('btnRefresh'),main=document.getElementById('main');
  b.classList.add('spinning');b.disabled=true;
  main.innerHTML='<div class="loading"><div class="spinner"></div><div class="text">正在加载数据...</div></div>';
  
  const [benchData,...etfResults]=await Promise.all([loadNav(BENCH),...ETFS.map(c=>loadNav(c))]);
  
  const subs=[];
  for(let i=0;i<ETFS.length;i++){
    const r=etfResults[i];
    if(r&&r.rows)subs.push({code:ETFS[i],name:r.name,nav:r.rows[r.rows.length-1].nav,divs:r.rows.filter(x=>x.div>0).length});
  }
  
  const sigData=etfResults[1]&&etfResults[1].rows?analyze(etfResults[1].rows):null;
  
  document.getElementById('updateTime').textContent='更新: '+new Date().toLocaleString('zh-CN');
  
  if(!sigData||!subs.length){
    main.innerHTML='<div class="empty">数据加载失败</div>';
    b.classList.remove('spinning');b.disabled=false;
    return;
  }
  
  const s=sigData;
  const rsiPct=Math.min(Math.max(s.rsi14,0),100);
  const biasPct=Math.min(Math.max((s.bias20+10)/15*100,0),100);
  
  main.innerHTML=`
    <div class="hero" style="border-left:3px solid ${s.signalColor}">
      <div class="hero-name">红利低波100</div>
      <div class="hero-code">930955.CSI · 数据源: 515100</div>
      <div class="hero-signal">
        <div class="hero-badge" style="background:${s.signalColor}18;color:${s.signalColor}">${s.signal}</div>
      </div>
      <div class="hero-desc">${s.signalDesc}</div>
      <div class="hero-metrics" style="margin-top:16px">
        <div class="hero-metric">
          <div class="hero-metric-label">现价</div>
          <div class="hero-metric-value">${s.latest.toFixed(4)}</div>
        </div>
        <div class="hero-metric">
          <div class="hero-metric-label">偏离20日</div>
          <div class="hero-metric-value" style="color:${s.bias20<-3?'#ff6b6b':s.bias20<-1?'#ffa94d':'var(--text-primary)'}">${s.bias20>0?'+':''}${s.bias20.toFixed(1)}%</div>
        </div>
        <div class="hero-metric">
          <div class="hero-metric-label">RSI14</div>
          <div class="hero-metric-value" style="color:${s.rsi14<30?'#ff6b6b':s.rsi14<40?'#ffa94d':s.rsi14>70?'#4dabf7':'var(--text-primary)'}">${s.rsi14.toFixed(0)}</div>
        </div>
      </div>
      <div class="bar-wrap">
        <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">偏离度 (← 低估 | 高估 →)</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${biasPct}%;background:${s.bias20<-3?'#ff6b6b':s.bias20<-1?'#ffa94d':'#868e96'}"></div><div class="bar-marker" style="left:46.7%"></div></div>
        <div class="bar-label"><span>-10%</span><span>-3%触发</span><span>0%</span><span>+5%</span></div>
      </div>
      <div class="bar-wrap" style="margin-top:8px">
        <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">RSI (← 超卖 | 超买 →)</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${rsiPct}%;background:${s.rsi14<30?'#ff6b6b':s.rsi14<40?'#ffa94d':s.rsi14>70?'#4dabf7':'#868e96'}"></div><div class="bar-marker" style="left:35%"></div></div>
        <div class="bar-label"><span>0</span><span>35触发</span><span>50</span><span>100</span></div>
      </div>
    </div>
    
    <div class="section">
      <div class="section-title">📋 信号状态</div>
      <div class="status-row"><div class="status-dot ${s.buyTriggered?'status-on':s.buyNear?'status-warn':'status-off'}"></div><div>买入信号: ${s.buyTriggered?'<strong style="color:#ff6b6b">已触发</strong>':s.buyNear?'接近 (<strong style="color:#ffa94d">关注</strong>)':'未触发'}</div></div>
      <div class="status-row"><div class="status-dot status-off"></div><div>卖出信号: RSI > 65 <strong>或</strong> 持仓 ≥ 25天</div></div>
      <div style="margin-top:8px;padding:8px 12px;background:rgba(255,255,255,0.02);border-radius:8px;font-size:11px;color:var(--text-muted)">
        5日涨幅: <span style="color:${s.ret5<-3?'#ff6b6b':'var(--text-primary)'};font-weight:600">${s.ret5>0?'+':''}${s.ret5.toFixed(1)}%</span> &nbsp;|&nbsp;
        5日均线: ${s.ma5.toFixed(4)} &nbsp;|&nbsp;
        10日均线: ${s.ma10.toFixed(4)}
      </div>
    </div>
    
    <div class="section">
      <div class="section-title">📈 辅助指标</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div style="text-align:center;padding:12px;background:rgba(255,255,255,0.02);border-radius:10px">
          <div style="font-size:10px;color:var(--text-muted)">TTM股息率</div>
          <div style="font-size:18px;font-weight:700;margin-top:4px;color:var(--accent)">${s.yieldTTM.toFixed(2)}%</div>
        </div>
        <div style="text-align:center;padding:12px;background:rgba(255,255,255,0.02);border-radius:10px">
          <div style="font-size:10px;color:var(--text-muted)">股息率百分位</div>
          <div style="font-size:18px;font-weight:700;margin-top:4px">${s.yieldPct.toFixed(0)}%</div>
        </div>
        <div style="text-align:center;padding:12px;background:rgba(255,255,255,0.02);border-radius:10px">
          <div style="font-size:10px;color:var(--text-muted)">历史分红</div>
          <div style="font-size:18px;font-weight:700;margin-top:4px">${s.divs}次</div>
        </div>
        <div style="text-align:center;padding:12px;background:rgba(255,255,255,0.02);border-radius:10px">
          <div style="font-size:10px;color:var(--text-muted)">RSI6</div>
          <div style="font-size:18px;font-weight:700;margin-top:4px">${s.rsi6.toFixed(0)}</div>
        </div>
      </div>
    </div>
    
    <div class="section">
      <div class="section-title">🏦 追踪该指数的ETF</div>
      ${subs.map(s=>'<div class="etf-row"><div><div class="etf-name">'+s.name+'</div><div class="etf-code">'+s.code+'</div></div><div style="text-align:right"><div class="etf-nav">'+s.nav.toFixed(4)+'</div><div class="etf-extra">'+s.divs+'次分红</div></div></div>').join('')}
    </div>
    
    <div class="section">
      <div class="section-title">📐 策略规则</div>
      <div class="strategy-box">
        <strong>买入条件 (三重确认)：</strong><br>
        ① 价格偏离20日均线 < <span class="danger">-3%</span><br>
        ② RSI14 < <span class="danger">35</span><br>
        ③ 5日涨幅 < <span class="danger">-3%</span><br><br>
        <strong>卖出条件 (先到先卖)：</strong><br>
        ① RSI14 > <span class="highlight">65</span>，或<br>
        ② 持仓满 <span class="highlight">25天</span><br><br>
        <strong>回测结果 (2020-2026)：</strong><br>
        · 超额收益 <span class="highlight">+48.0%</span> (vs 买入持有45.2%)<br>
        · 16笔交易 <span class="highlight">100%胜率</span><br>
        · 最大回撤 <span class="warn">-5.9%</span><br>
        · 扣除30bps成本后超额仍有 <span class="highlight">+30%+</span><br><br>
        <strong>⚠️ 适用场景：</strong>熊市/震荡市有效(超额+20%)，牛市跑输(-10%~-20%)。适合作为加仓参考。
      </div>
    </div>
  `;
  
  b.classList.remove('spinning');b.disabled=false;
}

function closeModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('modalOverlay').classList.remove('active');document.body.style.overflow=''}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=10').catch(()=>{});
</script>
</body>
</html>
